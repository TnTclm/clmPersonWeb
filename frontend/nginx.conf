# ============================================================
# Nginx 配置：前端静态文件 + 反向代理后端
#
# 它扮演的角色，和本地开发时 vite.config.js 里的 proxy 一模一样：
#   浏览器 → Nginx(80) ─┬─ /          → 直接返回打包好的 Vue 文件
#                       ├─ /api/     → 转给后端 Go 服务
#                       ├─ /uploads/ → 转给后端（用户上传的图片）
#                       └─ /pictures/→ 转给后端（主页图片墙）
# ============================================================

server {
    listen 80;

    # server_name：域名。备案通过后改成 clm520.cn；
    # 现在先用 IP 访问，写 _ 表示"任意域名都接受"
    server_name _;

    # 网站根目录 = 第一段打包出来的 dist 内容
    root /usr/share/nginx/html;

    # 默认首页
    index index.html;

    # 允许上传的最大文件体积（相册有视频，调大一些）
    # 注意要和后端 gin 的 128MB 上传缓冲配合
    client_max_body_size 200m;

    # ---------- 前端路由 ----------
    location / {
        # Vue 是"单页应用"：/talks/3 这种地址在磁盘上并没有对应的 html 文件。
        # try_files 的逻辑：先找同名文件 → 再找同名目录 →
        # 都找不到就统统返回 index.html，交给前端路由自己解析
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端接口 ----------
    location /api/ {
        # backend 是 docker-compose 里的服务名，
        # 同一个 compose 网络里可以直接当域名用（Docker 内置 DNS 负责解析）
        proxy_pass http://backend:8080;

        # 把真实访问信息传给后端（以后要记录访客 IP、做限流时会用到）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 用户上传的图片/视频 ----------
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # ---------- 主页图片墙的照片 ----------
    location /pictures/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}
